<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="世界日報" />
  <meta name="theme-color" content="#f4f2ec" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4" />
  <title>全球政經財金科技深度日報</title>
  <style>
    :root {
      --bg: #f4f2ec;
      --surface: #ffffff;
      --surface-2: #ece9e0;
      --text: #1a1a1c;
      --muted: #5b616b;
      --border: #dedad0;
      --accent: #102347;
      --accent-soft: rgba(16, 35, 71, 0.08);
      --signal: #dc2626;
      --up: #15803d;
      --down: #b91c1c;
      --flat: #475569;
      --shadow: 0 2px 12px rgba(26, 26, 28, 0.04);
      --radius: 14px;
    }
    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1a2540;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #24324d;
      --accent: #93c5fd;
      --accent-soft: rgba(147, 197, 253, 0.14);
      --signal: #ef4444;
      --up: #4ade80;
      --down: #f87171;
      --flat: #94a3b8;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .topbar {
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px;
    }
    .topbar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.1em;
    }
    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select, button {
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 9px;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .tabbar-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 12px;
    }
    .tabbar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab-btn {
      position: relative;
      flex: 0 0 auto;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px 12px 11px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      transition: color 0.15s;
    }
    .tab-btn.active {
      color: var(--text);
      font-weight: 800;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 2.5px;
      border-radius: 2px;
      background: var(--signal);
    }
    .tab-count {
      display: inline-block;
      margin-left: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      opacity: 0.8;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
    }
    .masthead {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--text);
    }
    .issue-meta {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.28;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 0;
      font-size: 14.5px;
      color: var(--muted);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal);
    }
    .exec-list {
      margin: 0;
      padding-left: 18px;
    }
    .exec-list li {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .exec-list li:last-child { margin-bottom: 0; }
    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }
    .ticker {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .ticker-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .ticker-val {
      font-size: 17px;
      font-weight: 800;
      margin: 2px 0;
    }
    .ticker-chg {
      font-size: 12px;
      font-weight: 700;
    }
    .ticker-chg.up { color: var(--up); }
    .ticker-chg.down { color: var(--down); }
    .ticker-chg.flat { color: var(--flat); }
    .ticker-asof {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .topic-jump {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      width: 100%;
    }
    .topic-jump-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .topic-jump-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .section-banner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 4px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--text);
    }
    .section-banner h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }
    .section-banner span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .news-item h3 {
      margin: 0 0 10px;
      font-size: 17.5px;
      line-height: 1.4;
      font-weight: 800;
    }
    .news-summary {
      margin: 0 0 12px;
      font-size: 15px;
    }
    .sub-block {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .sub-block-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .sub-block ul {
      margin: 0;
      padding-left: 18px;
    }
    .verify-badge {
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0;
    }
    .sources {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .pager-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }
    .pager-btn {
      flex: 1;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 13.5px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .pager-btn.next {
      text-align: right;
    }
    .pager-btn.prev {
      text-align: left;
    }
    .pager-btn.invisible {
      visibility: hidden;
      pointer-events: none;
    }
    .locked-box {
      max-width: 440px;
      margin: 14vh auto 0;
      text-align: center;
    }
    .locked-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }
    .key-input {
      width: 100%;
      padding: 11px 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      margin: 12px 0;
    }
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      padding: 11px 16px;
      border-radius: 10px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1c;
      color: #f8fafc;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="sticky-header hidden" id="stickyHeader">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>WORLD BRIEF</span>
        </div>
        <div class="controls">
          <select id="issueSelect" aria-label="選擇期數"></select>
          <button id="refreshBtn" title="重新整理">↻</button>
          <button id="copyUrlBtn" title="複製專屬加密網址">🔗</button>
          <button id="themeBtn" title="切換深淺色">◐</button>
        </div>
      </div>
    </header>
    <div class="tabbar-wrap">
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="主題分頁"></nav>
    </div>
  </div>

  <main class="container" id="swipeArea">
    <section id="lockedView" class="card locked-box hidden">
      <div class="locked-icon">🔒</div>
      <h1 style="font-size:20px;">私人加密全球日報</h1>
      <p class="subtitle" id="lockedMsg">此頁面採用 AES-256-GCM 端對端加密。請使用您的專屬加密網址開啟，或在下方貼上解密金鑰。</p>
      <input type="password" id="manualKeyInput" class="key-input" placeholder="貼上解密金鑰或完整加密網址…" autocomplete="off" />
      <button id="unlockBtn" class="btn-primary">解鎖閱讀</button>
    </section>

    <section id="loadingView" class="card locked-box">
      <p class="subtitle">正在本機解密今日全球深度日報…</p>
    </section>

    <article id="reportView" class="hidden"></article>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "wb_secret_key_v1";
    const THEME_KEY = "wb_theme_v1";

    const SHORT_TAB_NAMES = {
      economy: "國際經濟",
      markets: "金融市場",
      politics: "國際政治",
      finance: "財金企業",
      tech: "科技 AI",
    };

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0b1120" : "#f4f2ec");
    }

    const savedTheme = localStorage.getItem(THEME_KEY) ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(savedTheme);

    document.getElementById("themeBtn").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function b64urlToBytes(str) {
      let s = str.trim().replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      const bin = atob(s);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function b64ToBytes(str) {
      const bin = atob(str);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function extractKeyFromInput(raw) {
      const trimmed = (raw || "").trim();
      if (!trimmed) return "";
      const hashIdx = trimmed.indexOf("#");
      if (hashIdx !== -1) return trimmed.slice(hashIdx + 1).trim();
      return trimmed;
    }

    async function importAesKey(keyB64Url) {
      const rawBytes = b64urlToBytes(keyB64Url);
      if (rawBytes.length !== 32) throw new Error("金鑰長度不正確");
      return crypto.subtle.importKey("raw", rawBytes, { name: "AES-GCM" }, false, ["decrypt"]);
    }

    async function decryptPayload(payload, cryptoKey) {
      const iv = b64ToBytes(payload.iv);
      const ct = b64ToBytes(payload.ct);
      const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, ct);
      return JSON.parse(new TextDecoder().decode(plainBuf));
    }

    async function fetchEncryptedJson(relPath, cryptoKey) {
      const res = await fetch(`${relPath}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`無法載入資料 (${res.status})`);
      const payload = await res.json();
      return decryptPayload(payload, cryptoKey);
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let currentKeyStr = "";
    let currentCryptoKey = null;
    let currentIndex = null;
    let currentReport = null;
    let currentTabs = [];
    let activeTabId = "overview";

    function buildTabs(report) {
      const tabs = [{ id: "overview", label: "總覽", count: null }];
      for (const sec of (report.sections || [])) {
        tabs.push({
          id: sec.id,
          label: SHORT_TAB_NAMES[sec.id] || sec.name,
          fullName: sec.name,
          count: (sec.items || []).length,
        });
      }
      return tabs;
    }

    function renderTabBar() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = currentTabs.map((t) => `
        <button
          class="tab-btn ${t.id === activeTabId ? "active" : ""}"
          role="tab"
          aria-selected="${t.id === activeTabId}"
          data-tab="${esc(t.id)}"
        >
          ${esc(t.label)}${t.count !== null ? `<span class="tab-count">${t.count}</span>` : ""}
        </button>
      `).join("");

      tabbar.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      const activeBtn = tabbar.querySelector(".tab-btn.active");
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }
    }

    function renderPager() {
      const idx = currentTabs.findIndex((t) => t.id === activeTabId);
      const prev = idx > 0 ? currentTabs[idx - 1] : null;
      const next = idx < currentTabs.length - 1 ? currentTabs[idx + 1] : null;
      return `
        <div class="pager-nav">
          <button class="pager-btn prev ${prev ? "" : "invisible"}" data-jump="${prev ? esc(prev.id) : ""}">
            ← ${prev ? esc(prev.label) : ""}
          </button>
          <button class="pager-btn next ${next ? "" : "invisible"}" data-jump="${next ? esc(next.id) : ""}">
            ${next ? esc(next.label) : ""} →
          </button>
        </div>
      `;
    }

    function renderOverview(report) {
      const execHtml = (report.executive_summary || []).length
        ? `<div class="card">
             <div class="card-title">今日核心摘要</div>
             <ul class="exec-list">${report.executive_summary.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
           </div>`
        : "";

      const marketHtml = (report.market_snapshot || []).length
        ? `<div class="card">
             <div class="card-title">關鍵市場數據</div>
             <div class="market-grid">
               ${report.market_snapshot.map((m) => `
                 <div class="ticker">
                   <div class="ticker-label">${esc(m.label)}</div>
                   <div class="ticker-val">${esc(m.value)}</div>
                   <div class="ticker-chg ${esc(m.direction || "flat")}">${esc(m.change || "")}</div>
                   ${m.as_of ? `<div class="ticker-asof">${esc(m.as_of)}</div>` : ""}
                 </div>
               `).join("")}
             </div>
           </div>`
        : "";

      const topicsHtml = (report.sections || []).length
        ? `<div class="card">
             <div class="card-title">主題快速切換</div>
             <div class="topic-grid">
               ${report.sections.map((s) => `
                 <button class="topic-jump" data-jump="${esc(s.id)}">
                   <span class="topic-jump-name">${esc(SHORT_TAB_NAMES[s.id] || s.name)}</span>
                   <span class="topic-jump-meta">${(s.items || []).length} 則深度分析 →</span>
                 </button>
               `).join("")}
             </div>
           </div>`
        : "";

      const watchHtml = (report.watch_ahead || []).length
        ? `<div class="card">
             <div class="card-title">未來 24–72 小時關注焦點</div>
             <ul class="exec-list">${report.watch_ahead.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
           </div>`
        : "";

      return `
        <div class="masthead">
          <div class="issue-meta">DAILY WORLD BRIEF · ${esc(report.date)}</div>
          <h1>${esc(report.title || "全球政經財金科技深度日報")}</h1>
          ${report.subtitle ? `<p class="subtitle">${esc(report.subtitle)}</p>` : ""}
        </div>
        ${execHtml}
        ${marketHtml}
        ${topicsHtml}
        ${watchHtml}
      `;
    }

    function renderSection(sec, report) {
      return `
        <div class="section-banner">
          <h2>${esc(sec.name)}</h2>
          <span>${esc(report.date)} · ${(sec.items || []).length} 則分析</span>
        </div>
        ${(sec.items || []).map((item) => `
          <div class="card news-item">
            <h3>${esc(item.headline)}</h3>
            <p class="news-summary">${esc(item.summary)}</p>
            ${(item.key_data || []).length ? `
              <div class="sub-block">
                <div class="sub-block-label">關鍵數據與事實</div>
                <ul>${item.key_data.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
              </div>` : ""}
            ${item.impact ? `
              <div class="sub-block">
                <div class="sub-block-label">市場與亞太／台灣影響</div>
                <div>${esc(item.impact)}</div>
              </div>` : ""}
            ${item.verification_note ? `<div class="verify-badge">✓ 查核說明：${esc(item.verification_note)}</div>` : ""}
            <div class="sources">
              ${(item.sources || []).map((src) => `
                <a class="source-link" href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">
                  ${esc(src.name)}${src.date ? ` · ${esc(src.date)}` : ""} ↗
                </a>
              `).join("")}
            </div>
          </div>
        `).join("")}
      `;
    }

    function renderActiveTab() {
      if (!currentReport) return;
      renderTabBar();
      const view = document.getElementById("reportView");
      let bodyHtml = "";
      if (activeTabId === "overview") {
        bodyHtml = renderOverview(currentReport);
      } else {
        const sec = (currentReport.sections || []).find((s) => s.id === activeTabId);
        bodyHtml = sec ? renderSection(sec, currentReport) : renderOverview(currentReport);
      }

      view.innerHTML = `
        ${bodyHtml}
        ${renderPager()}
        <div class="footer-note">
          AES-256-GCM 本機端對端解密 · 左右滑動可切換主題 · ${esc(currentReport.generated_at || currentReport.date)}
        </div>
      `;

      view.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.dataset.jump) switchTab(btn.dataset.jump);
        });
      });
    }

    function switchTab(tabId) {
      if (!currentTabs.some((t) => t.id === tabId)) tabId = "overview";
      activeTabId = tabId;
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    // Touch swipe left/right between tabs on mobile
    let touchStartX = 0;
    let touchStartY = 0;
    const swipeArea = document.getElementById("swipeArea");
    swipeArea.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    swipeArea.addEventListener("touchend", (e) => {
      if (!currentReport || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        const idx = currentTabs.findIndex((t) => t.id === activeTabId);
        if (dx < 0 && idx < currentTabs.length - 1) switchTab(currentTabs[idx + 1].id);
        if (dx > 0 && idx > 0) switchTab(currentTabs[idx - 1].id);
      }
    }, { passive: true });

    async function loadIssue(file) {
      document.getElementById("loadingView").classList.remove("hidden");
      document.getElementById("reportView").classList.add("hidden");
      currentReport = await fetchEncryptedJson(`./data/${file}`, currentCryptoKey);
      currentTabs = buildTabs(currentReport);
      activeTabId = "overview";
      renderActiveTab();
      document.getElementById("loadingView").classList.add("hidden");
      document.getElementById("reportView").classList.remove("hidden");
    }

    async function boot(rawKey) {
      const lockedView = document.getElementById("lockedView");
      const loadingView = document.getElementById("loadingView");
      const reportView = document.getElementById("reportView");
      const stickyHeader = document.getElementById("stickyHeader");

      if (!rawKey) {
        loadingView.classList.add("hidden");
        lockedView.classList.remove("hidden");
        return;
      }

      try {
        lockedView.classList.add("hidden");
        loadingView.classList.remove("hidden");

        currentCryptoKey = await importAesKey(rawKey);
        currentIndex = await fetchEncryptedJson("./data/index.enc", currentCryptoKey);
        currentKeyStr = rawKey;
        localStorage.setItem(STORAGE_KEY, rawKey);
        if (window.location.hash !== `#${rawKey}`) {
          history.replaceState(null, "", `#${rawKey}`);
        }

        const select = document.getElementById("issueSelect");
        select.innerHTML = (currentIndex.issues || [])
          .map((it) => `<option value="${esc(it.file)}">${esc(it.date)}</option>`)
          .join("");

        stickyHeader.classList.remove("hidden");
        if (currentIndex.issues && currentIndex.issues.length > 0) {
          await loadIssue(currentIndex.issues[0].file);
        } else {
          loadingView.classList.add("hidden");
          reportView.innerHTML = `<div class="card"><p>目前尚無已發佈的日報。</p></div>`;
          reportView.classList.remove("hidden");
        }
      } catch (err) {
        console.error(err);
        loadingView.classList.add("hidden");
        reportView.classList.add("hidden");
        stickyHeader.classList.add("hidden");
        document.getElementById("lockedMsg").textContent = "解密失敗：金鑰不正確或連結不完整。請確認您的專屬加密網址。";
        lockedView.classList.remove("hidden");
      }
    }

    document.getElementById("issueSelect").addEventListener("change", (e) => {
      if (e.target.value) loadIssue(e.target.value);
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      boot(currentKeyStr);
      showToast("已重新載入最新期數");
    });

    document.getElementById("copyUrlBtn").addEventListener("click", async () => {
      const url = `${window.location.origin}${window.location.pathname}#${currentKeyStr}`;
      try {
        await navigator.clipboard.writeText(url);
        showToast("已複製專屬加密網址");
      } catch {
        prompt("請複製您的專屬加密網址：", url);
      }
    });

    document.getElementById("unlockBtn").addEventListener("click", () => {
      const k = extractKeyFromInput(document.getElementById("manualKeyInput").value);
      boot(k);
    });

    const hashKey = extractKeyFromInput(window.location.hash);
    const initialKey = hashKey || localStorage.getItem(STORAGE_KEY) || "";
    boot(initialKey);
  </script>
</body>
</html>
